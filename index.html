<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#cc2200">
  <meta name="app-version" content="20260901123718">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ortswehr">
  <title>Ortswehr</title>
  <link id="manifest-link" rel="manifest" href="manifest.json">
  <script>
    // manifest.json kann nicht wie index.html/pages.js einfach identisch nach ortswehr UND
    // ortswehr-dev gepusht werden (der Browser braucht bereits beim Laden die richtige Datei für
    // "Zum Startbildschirm hinzufügen", u. a. App-Name/start_url) - deshalb hier ganz früh,
    // synchron, per Pfad umgeschaltet, bevor irgendetwas den Manifest-Link auswertet. Zweite
    // Datei manifest-dev.json liegt in beiden Repos mit, ist auf PROD einfach ungenutzt.
    if (location.pathname.includes('ortswehr-dev')) {
      document.getElementById('manifest-link').href = 'manifest-dev.json';
    }
  </script>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- ?v=<version> auf den eigenen JS/CSS-Dateien: GitHub Pages liefert sie mit einem längeren
       Cache-Control/max-age, der Update-Mechanismus unten (Service-Worker abmelden + Caches
       leeren + reload) reicht dafür allein NICHT zuverlässig aus - der Browser kann trotzdem die
       alte Datei unter derselben URL aus dem HTTP-Disk-Cache bedienen. Mit einer bei jedem Deploy
       geänderten Query-Version ist es für den Browser eine komplett neue URL, garantiert frischer
       Fetch. Versionsstring hier bei jedem Deploy synchron zu <meta name="app-version"> halten. -->
  <link rel="stylesheet" href="css/style.css?v=20260901123718">
</head>
<body>

<!-- Lade-Overlay: sichtbar bis Firebase onAuthStateChanged antwortet -->
<div id="app-loading" style="position:fixed;inset:0;background:var(--bg,#f1f5f9);display:flex;align-items:center;justify-content:center;z-index:9999;font-size:2rem">🚒</div>

<!-- Login -->
<div id="login-page" class="hidden">
  <div class="login-box">
    <div class="login-logo">🚒</div>
    <h1>Freiwillige Feuerwehr Beeskow</h1>
    <p class="sub">Löschzug Oegeln</p>
    <div id="install-hinweis" class="card" style="display:none;text-align:left;padding:0.85rem 0.9rem;margin-bottom:0.9rem;box-shadow:none;border:1px solid var(--border)">
      <div style="display:flex;align-items:flex-start;gap:0.6rem">
        <span id="install-hinweis-icon" style="font-size:1.2rem;line-height:1.3;flex-shrink:0"></span>

          <div id="install-hinweis-titel" style="font-weight:700;font-size:0.83rem;margin-bottom:0.15rem"></div>

            <input id="install-hinweis-link" readonly style="width:100%;font-size:0.76rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.5rem;color:var(--text)">

    <button class="btn btn-primary btn-full" id="login-btn">Anmelden</button>
    <p class="error-msg" id="login-error"></p>
    <p style="text-align:center;margin-top:0.8rem">
      <a href="#" id="pw-reset-link" style="color:var(--red);font-size:0.82rem;text-decoration:none">Passwort vergessen?</a>

    <div id="pw-reset-box" style="display:none;margin-top:0.8rem">
      <input id="reset-email" type="text" placeholder="Anmeldename" autocapitalize="none" autocomplete="off">
      <button type="button" class="btn btn-primary btn-full" id="reset-btn" style="margin-top:0.5rem">Wehrführer informieren</button>
      <p id="reset-msg" style="font-size:0.82rem;margin-top:0.5rem;text-align:center"></p>

    <p id="login-version" style="text-align:center;font-size:0.7rem;color:#374151;margin-top:1rem 0 0"></p>
    <script>document.getElementById('login-version').textContent=document.querySelector('meta[name="app-version"]')?.content||''</script>

<!-- Menü: über das ☰ in der Kopfzeile erreichbar, deckt die gesamte Seite ab (nicht nur ein
     schmales Drawer-Panel mit Backdrop) - listet Profil/Einstellungen sowie alle vom jeweiligen
     Kameraden erreichbaren Verwaltungsseiten an einer zentralen Stelle statt verteilt über

<div id="toast"></div>
<div id="update-banner" style="display:none;position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;background:#1e293b;color:#fff;border-radius:14px;padding:0.7rem 1.2rem;align-items:center;gap:0.8rem;box-shadow:0 4px 20px rgba(0,0,0,0.3);font-size:0.88rem;white-space:nowrap">
  🆕 Update verfügbar: <span id="update-version-label" style="font-family:monospace;font-size:0.8rem;opacity:0.8"></span>
  <button id="update-btn" style="background:var(--red);color:#fff;border:none;border-radius:8px;padding:0.35rem 0.9rem;font-size:0.85rem;cursor:pointer;font-weight:600">Jetzt aktualisieren</button>
  <button id="update-schliessen" style="background:none;border:none;color:#9ca3af;font-size:1.1rem;cursor:pointer;padding:0 0.2rem">✕</button>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail }
    from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
  import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, collectionGroup, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
  import { getMessaging, getToken, onMessage }
    from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js';
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject }
    from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';

  // Umgebungserkennung per Pfad (nicht Hostname!): GitHub Pages liefert beide Repos unter
  // demselben Host ob3s.github.io aus, unterschieden nur durch /ortswehr/ vs. /ortswehr-dev/.
  // Dieselbe index.html/pages.js wird unverändert nach ortswehr (PROD) UND ortswehr-dev (DEV)
  // gepusht, deshalb hier zur Laufzeit statt per Build-Schritt entscheiden (kein
  // Build-Step-Prinzip bleibt so erhalten). Capacitor lädt ebenfalls die echte https-URL,
  // daher greift dieselbe Erkennung auch dort.
  window.IST_DEV = location.pathname.includes('ortswehr-dev');
  window.APP_NAME = window.IST_DEV ? 'Ortswehr DEV' : 'Ortswehr';
  document.title = window.APP_NAME;
  document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', window.APP_NAME);

  const firebaseConfigProd = {
    apiKey: "AIzaSyDwV6LJUnL660nQnnlQ47QZnBc_bXzIezU",
    authDomain: "ffw-oegeln-791ca.firebaseapp.com",
    projectId: "ffw-oegeln-791ca",
    storageBucket: "ffw-oegeln-791ca.firebasestorage.app",
    messagingSenderId: "170034438620",
    appId: "1:170034438620:web:f2e40bf21b6a9b6987ef19"
  };
  const firebaseConfigDev = {
    apiKey: "AIzaSyAiG5H2bMIRqhMXJcOhn_GWaEPVAPlKm8k",
    authDomain: "ffw-oegeln-dev.firebaseapp.com",
    projectId: "ffw-oegeln-dev",
    storageBucket: "ffw-oegeln-dev.firebasestorage.app",
    messagingSenderId: "1083789051573",
    appId: "1:1083789051573:web:90aea329bd0d903c51a0fc"
  };
  const firebaseConfig = window.IST_DEV ? firebaseConfigDev : firebaseConfigProd;
  // VAPID-Key ist projektspezifisch (Cloud-Messaging-Webpush-Zertifikat), je Umgebung eigener Wert.
  const VAPID = window.IST_DEV
    ? 'BFaoLToH4xUKX-S-nwrLW-VnQFb9cNqPKbnHfIjFVDiOTF3Ty24l1-UYjJgzBFyokvQhbRi0WMI_xm4z6GDEMZ4'
    : 'BDpa4LsgE1SlkshoyiVWt7EQbSi2YVp0Z_27N1Ms6sxGA4qogEPI3PWcRTwn3vvsYAhT8b1mD3Hpj6plCx5CySg';

  const firebaseApp = initializeApp(firebaseConfig);
  const auth      = getAuth(firebaseApp);
  // Offline-Persistenz: Firestore cacht gelesene Daten in IndexedDB, damit beim Öffnen ohne Netz
  // zumindest der letzte bekannte Stand sofort da ist (nicht nur die App-Hülle, die der Service
  // Worker cacht, sondern auch die eigentlichen Inhalte) und offline erfasste Änderungen bei
  // Rückkehr ins Netz automatisch nachgesendet werden. Mehrere gleichzeitig offene Tabs teilen
  // sich den Cache (persistentMultipleTabManager). Fällt auf den Standard-Speicher-Cache zurück,
  // falls IndexedDB im Browser nicht verfügbar ist (z.B. mancher privater Modus).
  let db;
  try {
    db = initializeFirestore(firebaseApp, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
  } catch(e) {
    console.warn('Firestore-Offline-Cache nicht verfügbar, nutze Standard:', e);
    db = getFirestore(firebaseApp);
  }
  const storage   = getStorage(firebaseApp);
  let   messaging = null;
  try { messaging = getMessaging(firebaseApp); } catch(e) {}

  window.fw = {
    auth, db, messaging, storage, app: firebaseApp, user: null, profil: null, _vapid: VAPID,
    uploadPdf: async (file, path) => {
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      return await getDownloadURL(storageRef);
    },
    deletePdf: async (path) => {
      try { await deleteObject(ref(storage, path)); } catch(e) {}
    },

    async getDoc(path)          { return getDoc(doc(db, path)); },
    async setDoc(path, data)    { return setDoc(doc(db, path), data, { merge: true }); },
    async updateDoc(path, data) { return updateDoc(doc(db, path), data); },
    async deleteDoc(path)       { return deleteDoc(doc(db, path)); },
    async addDoc(col, data)     { return addDoc(collection(db, col), data); },
    async getDocs(col, ...c) {
      const q = c.length ? query(collection(db, col), ...c) : collection(db, col);
      return getDocs(q);
    },
    // Für "alle Unterkollektionen X über alle Parent-Dokumente hinweg" (z. B. alle
    // users/*/qualifikationen) - eine Netzwerk-Rundreise statt einer pro Parent-Dokument.
    async getDocsGroup(name, ...c) {
      const q = c.length ? query(collectionGroup(db, name), ...c) : collectionGroup(db, name);
      return getDocs(q);
    },
    where, orderBy, Timestamp,
    onSnapshot(col, ...c) { const q = c.length ? query(collection(db, col), ...c) : collection(db, col); return onSnapshot(q, () => {}); },
    onDocSnapshot(path, cb) { return onSnapshot(doc(db, path), cb); },
    onQuerySnapshot(col, cb, ...c) { const q = c.length ? query(collection(db, col), ...c) : collection(db, col); return onSnapshot(q, cb); },
    isWehrfuehrer()    { return this.profil?.rolle === 'wehrfuehrer'; },
    isGruppenfuehrer() { return ['gruppenführer','zugführer','wehrfuehrer'].includes(this.profil?.rolle); },
    isZugfuehrer()     { return ['zugführer','wehrfuehrer'].includes(this.profil?.rolle); },
    // Granulares Rollen-/Rechtekonzept: Wehrführer hat immer alles,
    // sonst zählen die Rechte des zugewiesenen Rangs (in fw.profil.rechte aufgelöst, siehe onAuthStateChanged)
    hatRecht(recht)    { return this.isWehrfuehrer() || this.profil?.rechte?.[recht] === true; },

    toast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show' + (isError ? ' error' : '');
      setTimeout(() => t.className = '', 2800);
    },
    setTitle(t)  { document.getElementById('page-title').textContent = t; },
    // Menü-Button (☰) und Zurück-Pfeil teilen sich denselben Platz in der Kopfzeile - auf
    // Unterseiten (showBack) macht Zurück mehr Sinn als das Menü, auf Top-Level-Seiten umgekehrt.
    showBack(cb) {
      const b=document.getElementById('back-btn'); b.classList.remove('hidden'); b.onclick=cb;
      document.getElementById('menu-btn')?.classList.add('hidden');
    },
    hideBack() {
      document.getElementById('back-btn').classList.add('hidden');
      document.getElementById('menu-btn')?.classList.remove('hidden');
    },
    showHeaderAction(label, cb) { const b=document.getElementById('header-action'); b.classList.remove('hidden'); b.textContent=label; b.onclick=cb; },
    hideHeaderAction() { document.getElementById('header-action').classList.add('hidden'); },

    async registerPush() {
      if (!messaging) { console.warn('Push: messaging nicht verfügbar'); return null; }

      // Capacitor native App erkennen
      const isNative = window.Capacitor?.isNativePlatform?.();
      if (isNative) {
        try {
          const { PushNotifications } = window.Capacitor.Plugins;
          if (!PushNotifications) { console.warn('Push: PushNotifications Plugin nicht verfügbar'); return null; }
          const perm = await PushNotifications.requestPermissions();
          if (perm.receive !== 'granted') { this.toast('Push: Berechtigung verweigert', true); return null; }
          await PushNotifications.register();
          PushNotifications.addListener('registration', async (token) => {
            console.log('Capacitor FCM Token:', token.value);
            const gespeichert = fw.profil?.fcmToken;
            if (token.value !== gespeichert) {
              await fw.setDoc('users/' + fw.user.uid, { fcmToken: token.value });
              if (fw.profil) fw.profil.fcmToken = token.value;
              console.log('Capacitor Token gespeichert');
            }
          });
          PushNotifications.addListener('registrationError', (err) => {
            console.error('Capacitor Push Fehler:', err);
          });
          PushNotifications.addListener('pushNotificationReceived', (notification) => {
            const alarm = notification.data?.alarm === 'true';
            fw.toast((alarm ? '🚨 ' : '🔔 ') + notification.title + ': ' + notification.body);
          });
        } catch(e) {
          console.error('Capacitor Push Fehler:', e);
        }
        return null;
      }

      // Web PWA Weg
      try {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { this.toast('Push: Berechtigung verweigert', true); return null; }
        const swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        await new Promise(resolve => {
          if (swReg.active) { resolve(); return; }
          const sw = swReg.installing || swReg.waiting;
          if (sw) { sw.addEventListener('statechange', e => { if (e.target.state === 'activated') resolve(); }); }
          else { swReg.addEventListener('updatefound', () => {
            swReg.installing.addEventListener('statechange', e => { if (e.target.state === 'activated') resolve(); });
          }); }
          setTimeout(resolve, 3000);
        });
        const token = await getToken(messaging, { vapidKey: VAPID, serviceWorkerRegistration: swReg });
        if (token) {
          const gespeichert = fw.profil?.fcmToken;
          if (token !== gespeichert) {
            console.log('FCM Token erneuert');
            await this.setDoc('users/' + this.user.uid, { fcmToken: token });
            if (fw.profil) fw.profil.fcmToken = token;
          }
        } else {
          console.warn('Push: Kein Token erhalten');
        }
        return token;
      } catch(e) {
        console.error('Push Fehler:', e);
        this.toast('Push: ' + (e.message || e.code), true);
        return null;
      }
    },
  };

  if (messaging) {
    onMessage(messaging, payload => {
      const title    = payload.notification?.title || `🚒 ${window.APP_NAME}`;
      const body     = payload.notification?.body  || '';
      const alarm    = payload.data?.alarm === 'true';
      const uebungId = payload.data?.uebungId || '';
      console.log('FCM Vordergrund:', title);
      fw.toast((alarm ? '🚨 ' : '🔔 ') + title + ': ' + body);
      if (alarm) {
        // Alarmton über Web Audio API
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const spieleTon = (freq, start, dauer) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.6, ctx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dauer);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + dauer);
          };
          // 3x Alarm-Piep
          spieleTon(880, 0.0, 0.3);
          spieleTon(880, 0.4, 0.3);
          spieleTon(880, 0.8, 0.6);
        } catch(e) { console.warn('Audio nicht verfügbar:', e); }
        if (uebungId) setTimeout(() => navigate('uebung-detail', { id: uebungId, typ: 'einsatz' }), 1500);
      } else if (uebungId === 'pruefaufgaben') {
        setTimeout(() => navigate('dienste'), 500);
      }
    });
  }

  // Installations-Hinweis: nur auf Mobilgeräten und nur solange nicht als PWA installiert - am
  // Desktop wird die App normal im Browser-Tab genutzt, kein Installations-Bedarf. Firefox
  // (Android) kann PWAs generell nicht mehr installieren, auf iOS geht Installation NUR über
  // Safari (andere iOS-Browser laufen zwar technisch auf Safaris Engine, dürfen aber selbst keine
  // PWA installieren - Apple-Systembeschränkung, kein Bug hier). Statt nur eine Textzeile
  // hinzuwerfen ("mach das mal in Chrome") bekommt der Nutzer eine konkrete Handlung angeboten:
  // auf Android ein Button, der Chrome direkt per Android-Intent öffnet (Play-Store-Fallback
  // falls nicht installiert); wo sich kein Browser aus JS heraus öffnen lässt (iOS), ein "Link
  // kopieren"-Button statt Menü-Jagd-Anleitungen. Bewusst nicht schließbar (kein Nutzer-Feedback
  // dazu, kein X-Button) - ein geschlossener Hinweis, der beim nächsten Aufruf verschwunden
  // bleibt, hätte den Kameraden genau in dem Moment allein gelassen, in dem er noch nicht
  // installiert hat; er soll so lange sichtbar bleiben, bis die App tatsächlich installiert ist
  // (dann verschwindet er automatisch über den bereitsInstalliert-Check oben). Läuft nur auf dem
  // Login-Screen (vor Auth) - genau da landen neu eingeladene Kameraden über den Link/QR-Code aus
  // "Kameraden einladen".
  (function installHinweisPruefen() {
    const bereitsInstalliert = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (bereitsInstalliert) return;

    const ua = navigator.userAgent;
    const istIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const istAndroid = /Android/.test(ua);
    if (!istIOS && !istAndroid) return; // Desktop: kein Hinweis nötig

    const istFirefox = /Firefox\//.test(ua) || /FxiOS\//.test(ua);
    const istSafariIOS = istIOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);

    const box       = document.getElementById('install-hinweis');
    const iconEl    = document.getElementById('install-hinweis-icon');
    const titelEl   = document.getElementById('install-hinweis-titel');
    const textEl    = document.getElementById('install-hinweis-text');
    const aktionenEl = document.getElementById('install-hinweis-aktionen');
    const linkBox   = document.getElementById('install-hinweis-linkbox');
    const linkInput = document.getElementById('install-hinweis-link');

    const linkKopierenButton = () => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-secondary btn-sm';
      btn.textContent = '📋 Link kopieren';
      btn.onclick = async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          btn.textContent = '✅ Kopiert';
          setTimeout(() => { btn.textContent = '📋 Link kopieren'; }, 2000);
        } catch (e) {
          linkInput.value = location.href;
          linkBox.style.display = 'block';
          linkInput.select();
        }
      };
      return btn;
    };

    // Android-Intent: öffnet Chrome direkt mit der aktuellen URL (funktioniert auch aus Firefox
    // heraus als normaler Link-Tap), fällt auf den Play-Store-Eintrag zurück falls Chrome fehlt.
    const chromeOeffnenButton = () => {
      const ohneSchema = location.href.replace(/^https?:\/\//, '');
      const fallback = encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome');
      const intentUrl = `intent://${ohneSchema}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallback};end`;
      const a = document.createElement('a');
      a.href = intentUrl;
      a.className = 'btn btn-primary btn-sm';
      a.style.textDecoration = 'none';
      a.textContent = '🌐 In Chrome öffnen';
      return a;
    };

    let istWarnung = false;
    let icon = '', titel = '', text = '';
    let aktionen = [];

    if (istIOS && !istSafariIOS) {
      istWarnung = true;
      icon = '🧭'; titel = 'Installation nur über Safari möglich';
      text = 'iPhone/iPad erlauben App-Installation nur über Safari (Apple-Vorgabe, kein Fehler dieser App). Am einfachsten: Link kopieren und in Safari einfügen.';
      aktionen = [linkKopierenButton()];
    } else if (istFirefox) { // hier immer Android, da iOS-Firefox schon oben abgefangen ist
      istWarnung = true;
      icon = '🌐'; titel = 'Firefox kann diese App nicht installieren';
      text = 'Am einfachsten direkt in Chrome öffnen:';
      aktionen = [chromeOeffnenButton(), linkKopierenButton()];
    } else if (istIOS) { // Safari
      icon = '💡'; titel = 'Als App installieren';
      text = 'Unten auf Teilen tippen, dann „Zum Home-Bildschirm" – installiert die App wie eine normale App, inkl. Icon und Benachrichtigungen.';
    } else { // Android, Chromium-Browser
      icon = '💡'; titel = 'Als App installieren';
      text = 'Menü (⋮) → „App installieren" bzw. „Zum Startbildschirm hinzufügen".';
    }

    // Für installierbare Chromium-Browser: nativen Install-Prompt einfangen und als direkten
    // Button anbieten, statt nur auf das Browser-Menü zu verweisen. Das Event kann mehrfach
    // feuern (z. B. nach Abbruch/Schließen des nativen Dialogs) - jedes Mal denselben Button
    // wiederverwenden statt einen weiteren anzuhängen (sonst duplizieren sich die Buttons).
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      let btn = aktionenEl.querySelector('[data-install-btn]');
      if (!btn) {
        btn = document.createElement('button');
        btn.dataset.installBtn = '1';
        btn.className = 'btn btn-primary btn-sm';
        btn.textContent = '📲 Jetzt installieren';
        aktionenEl.prepend(btn);
      }
      btn.onclick = () => e.prompt();
    });

    box.style.borderLeft = '3px solid ' + (istWarnung ? 'var(--warning)' : 'var(--red)');
    iconEl.textContent = icon;
    titelEl.textContent = titel;
    textEl.textContent = text;
    aktionen.forEach(el => aktionenEl.appendChild(el));
    box.style.display = 'block';
  })();

  // Login
  document.getElementById('login-btn').addEventListener('click', async () => {
    const name = document.getElementById('login-email').value.trim().toLowerCase();
    const pass = document.getElementById('login-pass').value;
    document.getElementById('login-error').textContent = '';
    const email = name.includes('@') ? name : name + '@ffw-oegeln.de';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      // Credentials im nativen Store speichern (überlebt Cache-Leerung)
      if (typeof window.CredentialStore !== 'undefined') {
        window.CredentialStore.save(email, pass);
      }
    }
    catch(e) { document.getElementById('login-error').textContent = 'Benutzername oder Passwort falsch'; }
  });
  ['login-email','login-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  });

  // Passwort vergessen
  document.getElementById('pw-reset-link').addEventListener('click', e => {
    e.preventDefault();
    const box = document.getElementById('pw-reset-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('reset-btn').addEventListener('click', async () => {
    const loginName = document.getElementById('reset-email').value.trim().toLowerCase();
    const msg = document.getElementById('reset-msg');
    if (!loginName) { msg.textContent = 'Bitte Anmeldename eingeben'; msg.style.color = 'var(--red)'; return; }
    try {
      document.getElementById('reset-btn').disabled = true;
      const res = await fetch(window.IST_DEV
        ? 'https://requestpasswordreset-i7y73cc75a-ey.a.run.app'
        : 'https://europe-west3-ffw-oegeln-791ca.cloudfunctions.net/requestPasswordReset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginName }),
      });
      if (res.status === 404) { msg.textContent = 'Anmeldename nicht gefunden'; msg.style.color = 'var(--red)'; document.getElementById('reset-btn').disabled = false; return; }
      if (!res.ok) throw new Error(await res.text());
      msg.textContent = '✅ Wehrführer wurde informiert.';
      msg.style.color = 'var(--success)';
    } catch(e) {
      msg.textContent = 'Fehler: ' + e.message;
      msg.style.color = 'var(--red)';
      document.getElementById('reset-btn').disabled = false;
    }
  });

  // Auth State
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      fw.user = user;
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        fw.profil = { id: user.uid, ...snap.data() };
        // ortswehrIds Kompatibilität
        if (!fw.profil.ortswehrIds) {
          fw.profil.ortswehrIds = fw.profil.ortswehrId ? [fw.profil.ortswehrId] : [];
        }
        if (!fw.profil.ortswehrId && fw.profil.ortswehrIds.length) {
          fw.profil.ortswehrId = fw.profil.ortswehrIds[0];
        }
        // Standardwerte für fehlende Einstellungen setzen
        const defaults = {};
        if (fw.profil.notif_einsatz         === undefined) defaults.notif_einsatz         = true;
        if (fw.profil.notif_uebung          === undefined) defaults.notif_uebung          = true;
        if (fw.profil.notif_bestaetigung    === undefined) defaults.notif_bestaetigung    = true;
        if (fw.profil.notif_dienst_reminder === undefined) defaults.notif_dienst_reminder = true;
        if (fw.profil.notif_status          === undefined) defaults.notif_status          = true;
        if (fw.profil.theme                 === undefined) defaults.theme                 = 'klassisch';
        if (Object.keys(defaults).length > 0) {
          Object.assign(fw.profil, defaults);
          await updateDoc(doc(db, 'users', user.uid), defaults);
        }
        // Theme sofort anwenden
        const t = fw.profil.theme;
        if (t === 'klassisch') document.body.setAttribute('data-theme', 'klassisch');
        else document.body.removeAttribute('data-theme');
        // Rang auflösen: Rechte des zugewiesenen Rangs laden (Wehrführer braucht das nicht, hat eh alles)
        fw.profil.rechte = {};
        if (!fw.isWehrfuehrer() && fw.profil.rangId) {
          try {
            const rangSnap = await getDoc(doc(db, 'raenge', fw.profil.rangId));
            if (rangSnap.exists()) fw.profil.rechte = rangSnap.data().rechte || {};
          } catch(e) { console.warn('Rang konnte nicht geladen werden:', e); }
        }
      } else {
        fw.profil = { id: user.uid, email: user.email, rolle: 'kamerad',
          vorname: '', nachname: '', dienstgrad: '',
          notif_einsatz: true, notif_uebung: true, notif_bestaetigung: true,
          notif_dienst_reminder: true, notif_status: true, theme: 'klassisch' };
        await setDoc(doc(db, 'users', user.uid), fw.profil);
        document.body.setAttribute('data-theme', 'klassisch');
      }
      if (fw.hatRecht('kameraden_ansehen')) {
        document.getElementById('nav-kameraden').classList.remove('hidden');
      }
      menuAufbauen();
      if (fw.profil.notif_einsatz || fw.profil.notif_uebung || fw.profil.notif_bestaetigung) {
        // Warten bis SW bereit ist bevor Push registriert wird
        navigator.serviceWorker.ready.then(() => fw.registerPush()).catch(() => {});
      }
      document.getElementById('login-page').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('app-loading')?.remove();
      navigate('dashboard');
    } else {
      fw.user = null; fw.profil = null;
      document.getElementById('nav-kameraden').classList.add('hidden');
      document.getElementById('app').classList.add('hidden');
      menuSchliessen();
      // Auto-Login: gespeicherte Credentials aus nativem Store versuchen
      if (typeof window.CredentialStore !== 'undefined') {
        const savedEmail = window.CredentialStore.getEmail();
        const savedPass  = window.CredentialStore.getPassword();
        if (savedEmail && savedPass) {
          try {
            await signInWithEmailAndPassword(auth, savedEmail, savedPass);
            return; // onAuthStateChanged feuert erneut mit User
          } catch(e) {
            // Credentials ungültig (z.B. Passwort geändert) → löschen und Login zeigen
            window.CredentialStore.clear();
          }
        }
      }
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-loading')?.remove();
    }
  });

  // Nachrichten vom Service Worker empfangen (z.B. nach Notification-Klick)
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'NAVIGATE') {
      const url = new URL(e.data.url);
      const uebungId = url.searchParams.get('uebung');
      if (uebungId) navigate('uebung-detail', { id: uebungId, typ: 'einsatz' });
    }
  });

  window._navHistory = [];
  window.navigate = function(page, params = {}) {
    // Aktiven Live-Listener aufräumen beim Seitenwechsel
    if (window._einsatzListener) { window._einsatzListener(); window._einsatzListener = null; }
    if (window._newsFeedListener) { window._newsFeedListener(); window._newsFeedListener = null; }
    if (window.piperCleanup) window.piperCleanup();
    // Aktuelle Seite auf History-Stack pushen
    if (window._currentPage) {
      window._navHistory.push({ page: window._currentPage, params: window._currentParams || {} });
      if (window._navHistory.length > 20) window._navHistory.shift();
    }
    window._currentPage = page;
    window._currentParams = params;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('aktiv', b.dataset.page === page));
    fw.hideBack(); fw.hideHeaderAction();
    document.getElementById('main-content').innerHTML = '<div class="loading">⏳</div>';
    window._pages[page]?.(document.getElementById('main-content'), params);
  };
  window.navigateBack = function() {
    const prev = window._navHistory.pop();
    if (prev) navigate(prev.page, prev.params);
  };
  // Aktuelle Seite neu laden (z.B. nach einer Änderung), OHNE einen neuen Eintrag auf den
  // History-Stack zu legen - sonst bleibt der Zurück-Pfeil bei jedem Aufruf "hängen", weil er
  // erst zur vorherigen (identisch aussehenden) Version derselben Seite zurückspringt.
  window.navigateReplace = function(page, params = {}) {
    if (window._einsatzListener) { window._einsatzListener(); window._einsatzListener = null; }
    if (window._newsFeedListener) { window._newsFeedListener(); window._newsFeedListener = null; }
    if (window.piperCleanup) window.piperCleanup();
    window._currentPage = page;
    window._currentParams = params;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('aktiv', b.dataset.page === page));
    fw.hideBack(); fw.hideHeaderAction();
    document.getElementById('main-content').innerHTML = '<div class="loading">⏳</div>';
    window._pages[page]?.(document.getElementById('main-content'), params);
  };
  window._pages = {};
  window.registerPage = (name, fn) => { window._pages[name] = fn; };
  // Nav-Bar-Klicks setzen History zurück (Top-Level-Navigation)
  document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => {
    window._navHistory = [];
    navigate(b.dataset.page);
  }));

  // ── Menü (☰) ──────────────────────────────────────────────
  // Sammelstelle für Profil/Einstellungen + alle Verwaltungsseiten, vorher verteilt (u. a. am
  // Ende der Kameraden-Seite) - von überall über die Kopfzeile erreichbar statt nur von einer
  // bestimmten Seite aus.
  window.menuOeffnen = () => { document.getElementById('menu-drawer').style.transform = 'translateX(0)'; };
  window.menuSchliessen = () => { document.getElementById('menu-drawer').style.transform = 'translateX(-100%)'; };
  document.getElementById('menu-btn').addEventListener('click', menuOeffnen);
  document.getElementById('menu-schliessen').addEventListener('click', menuSchliessen);

  window.menuNavigieren = (page) => { menuSchliessen(); window._navHistory = []; navigate(page); };

  window.verfuegbarkeitUmschalten = async () => {
    const neu = !(fw.profil.verfuegbar !== false);
    await fw.setDoc('users/'+fw.user.uid, { verfuegbar: neu });
    fw.profil.verfuegbar = neu;
    menuAufbauen();
  };

  window.menuAufbauen = () => {
    const inh = document.getElementById('menu-drawer-inhalt');
    if (!inh || !fw.profil) return;
    const verfuegbar = fw.profil.verfuegbar !== false;
    const zeile = (icon, label, page, sub) => `
      <div class="list-item" onclick="menuNavigieren('${page}')">
        <div class="list-item-icon">${icon}</div>
        <div class="list-item-body">
          <div class="list-item-title">${label}</div>
          ${sub ? `<div class="list-item-sub">${sub}</div>` : ''}
        </div>
        <div class="list-chevron">›</div>
      </div>`;

    const verwaltung = [
      fw.hatRecht('stammdaten_dienstgrade')   && zeile('🎖️', 'Dienstgrade & Filter', 'einstellungen-admin'),
      fw.hatRecht('stammdaten_dienstarten')   && zeile('🚒', 'Dienst-Arten', 'dienstarten-verwalten'),
      fw.hatRecht('stammdaten_raenge')        && zeile('🏅', 'Ränge', 'raenge-verwalten'),
      fw.hatRecht('stammdaten_ortswehren')    && zeile('🏘️', 'Ortswehren', 'ortswehren'),
      (fw.hatRecht('loeschwasser_verwalten') || fw.hatRecht('loeschwasser_pruefen'))
                                               && zeile('💧', 'Löschwasser', 'loeschwasser-verwalten'),
      (fw.hatRecht('dienste_bearbeiten') || fw.hatRecht('einsaetze_bearbeiten'))
                                               && zeile('📋', 'Dienste & Einsätze bearbeiten', 'uebungen-backend'),
      fw.isWehrfuehrer()                      && zeile('➕', 'Neue Kameraden einladen', 'kameraden-einladen'),
      fw.isWehrfuehrer()                      && zeile('📡', 'API-Status', 'api-status'),
      fw.hatRecht('verwaltung_sehen')         && zeile('🛠️', 'Verwaltung', 'verwaltung'),
    ].filter(Boolean).join('');

    const mannschaft = fw.hatRecht('kameraden_ansehen') ? `
      <div class="section-header">Mannschaft</div>
      ${zeile('🎓', 'Lehrgänge', 'lehrgaenge')}
      ${zeile('📊', 'Statistik', 'statistik')}
    ` : '';

    inh.innerHTML = `
      <div class="section-header" style="margin-top:0">Persönlich</div>
      <div class="list-item" onclick="verfuegbarkeitUmschalten()">
        <div class="list-item-icon">${verfuegbar ? '🟢' : '🔴'}</div>
        <div class="list-item-body">
          <div class="list-item-title">${verfuegbar ? 'Verfügbar' : 'Nicht verfügbar'}</div>
          <div class="list-item-sub">${verfuegbar ? 'Du bekommst Einsatz-Alarme' : 'Keine Einsatz-Alarme, bis du dich wieder verfügbar meldest'}</div>
        </div>
      </div>
      ${zeile('👤', 'Mein Profil', 'profil')}
      ${zeile('⚙️', 'Einstellungen', 'einstellungen')}
      ${mannschaft}
      ${verwaltung ? `<div class="section-header">Verwaltung</div>${verwaltung}` : ''}
    `;
  };

  // Neuen Kamerad anlegen ohne Wehrführer auszuloggen
  window.createKamerad = async (email, pw, data) => {
    const { initializeApp: iApp, getApp } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js');
    const { getAuth: gAuth, createUserWithEmailAndPassword: createUser } = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js');
    let tmp; try { tmp = getApp('tmp'); } catch(e) { tmp = iApp(firebaseConfig, 'tmp'); }
    const ta = gAuth(tmp);
    const cred = await createUser(ta, email, pw);
    await ta.signOut();
    await setDoc(doc(db, 'users', cred.user.uid), { ...data, email, aktiv: true, notif_einsatz: true, notif_uebung: true, notif_bestaetigung: true });
    return cred.user.uid;
  };

  if ('serviceWorker' in navigator) {
    // Relativer Pfad statt hartcodiertem '/ortswehr/sw.js': funktioniert damit sowohl unter
    // /ortswehr/ (PROD) als auch /ortswehr-dev/ (DEV) - vorher zeigte DEV fälschlich auf den
    // PROD-Pfad.
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
      // Sofort auf Update prüfen
      reg.update();
      // Wenn neuer SW aktiviert → Seite automatisch neu laden
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    });
  }

  // Update-Prüfung: version.json vom Server holen (nie gecacht)
  window.pruefeAufUpdate = async (manuell = false) => {
    try {
      const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
      const { version } = await res.json();
      const lokal = document.querySelector('meta[name="app-version"]')?.content;
      if (lokal && version && version !== lokal) {
        const banner = document.getElementById('update-banner');
        const label  = document.getElementById('update-version-label');
        if (label) label.textContent = `v${version}`;
        if (banner) banner.style.display = 'flex';
        document.getElementById('update-btn').onclick = async () => {
          document.getElementById('update-btn').textContent = '⏳ Wird aktualisiert...';
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
            // Native App: WebView-Cache über Bridge leeren
            if (typeof CacheControl !== 'undefined') CacheControl.clearCache();
          } catch(e) {}
          window.location.reload(true);
        };
        document.getElementById('update-schliessen').onclick = () => {
          banner.style.display = 'none';
        };
      } else {
        const banner = document.getElementById('update-banner');
        if (banner) banner.style.display = 'none';
        if (manuell) fw.toast('✅ App ist aktuell (v' + lokal + ')');
      }
    } catch(e) {
      const bannerErr = document.getElementById('update-banner');
      if (bannerErr) bannerErr.style.display = 'none';
      if (manuell) fw.toast('Keine Verbindung', true);
    }
  };

  // Beim Start prüfen (kurze Verzögerung damit SW-Registrierung abgeschlossen ist)
  setTimeout(pruefeAufUpdate, 1500);

  // Uhr
  function tickUhr() {
    const el = document.getElementById('header-uhr');
    if (!el) return;
    const now = new Date();
    el.textContent = now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  tickUhr();
  setInterval(tickUhr, 1000);
</script>
